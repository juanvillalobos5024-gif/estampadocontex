<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contex - Laboratorio de Color</title>
    <script>
      // Detección y auto-recuperación inmediata de errores de conexión y carga de chunks
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('[Vite Preload] Error de precarga de módulo. Auto-recargando...');
        var key = 'vite_chunk_reload_ts';
        var last = sessionStorage.getItem(key);
        var now = Date.now();
        if (!last || now - parseInt(last, 10) > 8000) {
          sessionStorage.setItem(key, now.toString());
          window.location.reload();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? event.message.toLowerCase() : '';
        if (msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('loading chunk') !== -1) {
          console.warn('[Dynamic Import] Fallo de red detectado. Reintentando...');
          var key = 'dyn_chunk_reload_ts';
          var last = sessionStorage.getItem(key);
          var now = Date.now();
          if (!last || now - parseInt(last, 10) > 8000) {
            sessionStorage.setItem(key, now.toString());
            window.location.reload();
          }
        }
      });
    </script>
  </head>
  <body class="bg-slate-50">
    <div id="root">
      <!-- Splash screen inicial visible mientras se descarga el JavaScript (evita pantalla en blanco) -->
      <div style="min-height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; color: #1e293b;">
        <div style="width: 76px; height: 76px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; background: #ffffff;">
          <img src="/logo.jpeg" alt="Contex" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'" />
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; color: #0f172a; letter-spacing: -0.02em;">
          <svg style="width: 20px; height: 20px; animation: contex-spin 1s linear infinite; color: #2563eb;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
          <span>Cargando Contex Color...</span>
        </div>
        <p style="font-size: 12px; color: #64748b; margin-top: 6px; font-weight: 500;">Conectando con el taller</p>
        <style>
          @keyframes contex-spin { 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
